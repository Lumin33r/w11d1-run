---
name: Echo Workflow
on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
jobs:
  echo-job:
    runs-on: ubuntu-latest
    steps:
      - name: Echo Message
        run: echo "Hello, DevOps!"
      - name: Multi line step
        run: |
          pwd
      - name: Display GitHub Variables
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
      - name: Use Secrets and Variables
        env:
          MY_VARIABLE: ${{ vars.MY_VARIABLE }}
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "Variable: $MY_VARIABLE"
          if [ -n "$MY_SECRET" ]; then
            echo "Secret is configured"
          else
            echo "Secret is missing"
          fi